# Backing services for production — the app itself runs on the host under
# pm2 (see deploy/ecosystem.config.cjs). Everything binds to localhost only;
# Caddy (host-installed) is the sole public entrypoint.
#
#   cd /opt/tadf/app
#   docker compose --env-file .env -f deploy/docker-compose.infra.yml up -d

name: tadf

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-adf}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-adf} -d ${POSTGRES_DB:-adf}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-time setup after first boot — allow anonymous reads of the public
  # bucket (persisted in the seaweed volume):
  #   printf "s3.bucket.create -name adf-public\ns3.bucket.create -name adf-private\ns3.configure -user anonymous -buckets adf-public -actions Read -apply\n" \
  #     | docker exec -i tadf-seaweedfs-1 weed shell
  seaweedfs:
    image: chrislusf/seaweedfs:4.19
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set in .env}
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -filer
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed:/data

  # SMTP sink until a real provider is configured — captures all outgoing
  # mail. UI: ssh -L 8025:127.0.0.1:8025 tadf-vm → http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.25
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit:/data

volumes:
  pgdata:
  seaweed:
  mailpit:
